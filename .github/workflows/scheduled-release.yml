# SYSTEM-OWNED - do not edit, edits here are overwritten. This workflow is
# re-rendered from the central DSL teaching toolkit by 'Refresh actions' (nightly).
name: Scheduled release

# Reads each semester's semester-config/schedule.yml and, on every tick: freezes the submission
# snapshot for each assignment whose grading deadline has passed, fires every `releases:`
# release whose `when` datetime has arrived, and autogrades each frozen assignment ONCE
# (marker: semester-config/.system/autograde/<slug>/ - delete it to re-grade). Releases are
# idempotent, so re-releasing on the next tick is a no-op; grading is not re-run. Unattended
# it releases for real; manual runs default to dry-run.
#
# TWO DRIVERS, because GitHub delivers `schedule` best-effort and in practice delivers very
# little of it: measured 2-7% of the fires below, with gaps up to 13h. So this is also fired
# by `repository_dispatch` from an external dispatcher (every 15 minutes, off-box), and each
# driver covers the other's outage. Both arrive here as an ordinary run; nothing downstream
# cares which, because every action is dated and fire-once. The off-peak minutes stay as they
# are - GitHub drops scheduled runs at the top of the hour, so `0 * * * *` was delivered 6
# times a day, not 24 - and an idle tick is ~30s of reads, so the cost of arriving twice is
# negligible.
#
# ONE SEMESTER, when a semester's semester-config push fired this run (driver=semester-config):
# this run releases into that semester alone and asks Sync site - by dispatch, into its own
# queue, which the same push may already have started - for any render its releases need,
# instead of pushing the site repo alongside it. The cron and the ds01 timer still walk every semester.
#
# THREE JOBS. `release` walks every semester (fast: dated copies and repo provisioning) and is
# separate because a grading pass can run for two hours and must not hold up a release due
# meanwhile. `autograde` is one matrix leg per semester, each queued only against itself, and
# runs even when the release job failed - one semester's fault is nobody else's wait. And
# `autograde-report` files/closes the grading legs' failure issues from a runner of its own,
# because `autograde` executes the STUDENTS' code and a step after that one holding the bot
# token would run whatever they left in $GITHUB_ENV, as the org owner.

# A one-semester run says so in its title: the runs listing is all `cadence` can see, and a run
# that released into one semester is not a tick of the whole course.
run-name: ${{ (github.event_name == 'repository_dispatch' && (github.event.client_payload.driver == 'semester-config' || github.event.client_payload.driver == 'migrate') && github.event.client_payload.semester_org || '') && format('Scheduled release for cohort {0}', github.event.client_payload.semester_org) || 'Scheduled release' }}

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  repository_dispatch:
    types: [scheduled-release]
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview - list what WOULD open, release nothing"
        type: boolean
        default: true

permissions: {}

jobs:
  release:
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && inputs.preview != false && github.run_id || 'scheduled-release' }}
      cancel-in-progress: false
    outputs:
      semesters: ${{ steps.semesters.outputs.semesters }}
    # JOB-level, because the failure-issue steps' `if:` must see it and a step's `if:`
    # reads only job- and workflow-level env.
    env:
      SCOPED: ${{ (github.event_name == 'repository_dispatch' && (github.event.client_payload.driver == 'semester-config' || github.event.client_payload.driver == 'migrate') && github.event.client_payload.semester_org || '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: hertie-data-science-lab/dsl-teaching-toolkit
          ref: release
          # No credential left behind in $GITHUB_WORKSPACE/.git/config. Nothing here ever
          # pushes to the checkout - the central repo is public and read-only to these
          # jobs, and every write goes through `gh`/`gh auth setup-git` against ANOTHER
          # repo - so the persisted header buys nothing, and the grading jobs run the
          # student's own code with this directory on disk.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: List the semesters to grade
        id: semesters
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          COURSE: ${{ github.repository_owner }}
        run: |
          # FIRST, so the grading matrix is populated whatever the release pass does: a step
          # that fails skips the ones after it, and a release fault in one semester must not
          # cancel grading in the others. Assigned, not echoed inline: under `bash -e` a
          # failed substitution inside an echo would write an empty output on a GREEN step,
          # and grading would then be skipped for the whole course, silently.
          args=(--course-org "$COURSE" --list-semesters --no-preview)
          [ -n "$SCOPED" ] && args+=(--semester-org "$SCOPED")
          semesters=$(python3 -m dsl_course.scheduler "${args[@]}")
          echo "semesters=$semesters" >> "$GITHUB_OUTPUT"
      - name: Release what is due
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          COURSE: ${{ github.repository_owner }}
          PREVIEW: ${{ inputs.preview }}
          EVENT: ${{ github.event_name }}
          DRIVER: ${{ github.event.client_payload.driver }}
          OLD_PAYLOAD: ${{ github.event.client_payload.cohort_org }}
# A source the plan cites and the org has not got is emailed to the people git names for
# it, from this step (see dsl_course.notify) - so the release pass carries the transport
# alongside the token. Without it the digest issue's @mention is the only channel, which
# reaches whoever happens to read GitHub notifications that week. This pass also pre-flights
# the COURSE org's own dsl-course.yml and semester registry, whose mail goes to the course
# admins instead - a second address list, read only here and by Sync membership.
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_CERT: ${{ secrets.GRAPH_CLIENT_CERT }}
          GRAPH_SENDER: ${{ secrets.GRAPH_SENDER }}
          DSL_MAINTAINER_EMAIL: ${{ secrets.DSL_MAINTAINER_EMAIL }}
          DSL_COURSE_ADMIN_EMAILS: ${{ secrets.DSL_COURSE_ADMIN_EMAILS }}
        run: |
          if [ -n "$OLD_PAYLOAD" ]; then
            echo "::error::NOT_MIGRATED: this dispatch sends cohort_org, the old name of semester_org - run the migration"
            exit 1
          fi
          gh auth setup-git
          # Which driver delivered this tick. The run history is the only record of that,
          # and it is what says whether both drivers are alive (a dispatch names its
          # sender in client_payload.driver; the cron has nobody to name).
          echo "delivered by event=$EVENT driver=${DRIVER:-none}"
          if [ -n "$SCOPED" ]; then
            args=(--course-org "$COURSE" --semester-org "$SCOPED" --skip-autograde --defer-site-sync)
          else
            args=(--course-org "$COURSE" --all-semesters --skip-autograde)
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$PREVIEW" != "false" ]; then args+=(--preview); else args+=(--no-preview); fi
          exec python3 -m dsl_course.scheduler "${args[@]}" > >(tee "$RUNNER_TEMP/run.log") 2>&1
      - name: Report an unattended failure as an issue
        id: notice
        if: (failure() || cancelled()) && env.SCOPED == '' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="$WORKFLOW is failing"
          note=$(printf 'The unattended run failed or was cancelled: %s\n\nNothing retries it before the next scheduled run. This issue closes itself once a run succeeds.\n' "$RUN_URL")
          # A filed issue emails only the repo's watchers, which in practice is nobody, so
          # the FIRST report mentions the org's admins; course-admin, not instructors,
          # because broken infrastructure is not the teaching staff's problem.
          # Teaching staff read these too (course-admin is mentioned below), and a
          # broken run is not theirs to fix - so the note says who is already on it.
          note=$(printf '%s\nThe toolkit maintainer has been emailed the log - nothing for the instructors to do.\n' "$note")
          body=$(printf '%s\ncc @%s/course-admin\n' "$note" "${REPO%%/*}")
          # The step runs under `bash -e`, so an unguarded capture would abort the step on a
          # transient search failure - before the `gh issue create` that is the whole point.
          # No dedupe hit just means we file a fresh issue.
          existing=$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number,title,updatedAt --jq "map(select(.title == \"$title\"))[0] | select(.) | \"\(.number) \(.updatedAt)\"") || true
          # `report` is what gates the mail step below, so the two channels fire
          # together: a maintainer who gets an email can always find the issue it came
          # from, and a thread that is being kept quiet does not mail either.
          if [ -z "$existing" ]; then
            # Two strikes: a first failure files and mails only if this job also failed
            # in the previous run, so a one-off GitHub blip reaches nobody. Any lookup
            # error reports. GITHUB_WORKFLOW_REF ends `<file>@<ref>`.
            wf=${GITHUB_WORKFLOW_REF%@*}
            prior=$(gh api "repos/$REPO/actions/workflows/${wf##*/}/runs?per_page=30" \
              --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .event != \"workflow_dispatch\" and ((.display_title // \"\") | startswith(\"Scheduled release for cohort\") | not)) | .id" | head -n 10) || prior=""
            prev=""
            for id in $prior; do
              prev=$(gh api "repos/$REPO/actions/runs/$id/jobs" --paginate \
                --jq ".jobs[] | select(.name == \"release\" and .conclusion != null and .conclusion != \"skipped\" and (.conclusion != \"cancelled\" or ((.steps // []) | length) > 0)) | .conclusion" | head -n 1) || prev=""
              [ -n "$prev" ] && break
            done
            if [ "$prev" = "success" ]; then
              echo "first failure since the last good run - no issue or mail yet; the next run reports if it fails too"
              echo "report=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh issue create --repo "$REPO" --title "$title" --body "$body"
            echo "report=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Already open. The scheduler fails on EVERY tick while a fault stands, and a
          # comment per run buried the thread and mentioned course-admin dozens of times a
          # day about one fault. So comment only once the thread has been quiet for six hours,
          # and without the cc - whoever it reached the first time is already subscribed.
          # An unparseable timestamp reads as epoch, i.e. "long overdue": the point of the
          # issue is that somebody hears about the failure.
          last=$(date -u -d "${existing#* }" +%s 2>/dev/null || echo 0)
          if [ $(( $(date -u +%s) - last )) -lt 21600 ]; then
            echo "already reported within the last 6h - see issue ${existing%% *}"
            echo "report=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh issue comment "${existing%% *}" --repo "$REPO" --body "$note"
          echo "report=true" >> "$GITHUB_OUTPUT"
      - name: Email the maintainer the failed step's log
        if: (failure() || cancelled()) && env.SCOPED == '' && github.event_name != 'workflow_dispatch' && steps.notice.outputs.report == 'true'
        env:
          WORKFLOW: ${{ github.workflow }}
          COURSE: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_CERT: ${{ secrets.GRAPH_CLIENT_CERT }}
          GRAPH_SENDER: ${{ secrets.GRAPH_SENDER }}
          DSL_MAINTAINER_EMAIL: ${{ secrets.DSL_MAINTAINER_EMAIL }}
        run: |
          tail -n 30 "$RUNNER_TEMP/run.log" 2>/dev/null \
            | python3 -m dsl_course.notify run-failed --course-org "$COURSE" \
                --workflow "$WORKFLOW" --run-url "$RUN_URL" || true
      - name: Close the failure issue once a run succeeds
        if: success() && env.SCOPED == ''
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="$WORKFLOW is failing"
          for n in $(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number"); do
            gh issue close "$n" --repo "$REPO" --comment "Recovered: $RUN_URL"
          done
  autograde:
    # Named, because `autograde-report` below looks its legs up by name through the jobs
    # API - a string this file declares rather than one GitHub composes from the matrix.
    name: autograde ${{ matrix.semester }}
    needs: [release]
    # !cancelled(), because grading is gated on the durable snapshot marker, not on this
    # run's release pass: a red release must not silently skip a semester's grading - but a
    # run an operator CANCELLED must not go on to run student code for two hours. The output
    # test is the empty-matrix guard - GitHub errors on a matrix with no vectors, and a
    # course org with no semesters registered yet is a normal state, not a failure.
    if: "!cancelled() && needs.release.outputs.semesters != '' && needs.release.outputs.semesters != '[]'"
    strategy:
      # One semester's grading failure must not cancel the others' - they share nothing.
      fail-fast: false
      matrix:
        semester: ${{ fromJSON(needs.release.outputs.semesters) }}
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && inputs.preview != false && format('{0}-{1}', github.run_id, matrix.semester) || format('scheduled-autograde-{0}', matrix.semester) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: hertie-data-science-lab/dsl-teaching-toolkit
          ref: release
          # No credential left behind in $GITHUB_WORKSPACE/.git/config. Nothing here ever
          # pushes to the checkout - the central repo is public and read-only to these
          # jobs, and every write goes through `gh`/`gh auth setup-git` against ANOTHER
          # repo - so the persisted header buys nothing, and the grading jobs run the
          # student's own code with this directory on disk.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-autograde.txt
      - name: Create the account graded code runs as
        run: |
          id -u dsl-sandbox >/dev/null 2>&1 \
            || sudo useradd --system --no-create-home --shell /usr/sbin/nologin dsl-sandbox
          sudo -n -u dsl-sandbox true
      # THE LAST STEP OF THIS JOB, and it has to stay that way. It executes the students'
      # own notebooks, `run.sh` and hidden tests, and the runner sources whatever a step
      # leaves in $GITHUB_ENV / $GITHUB_PATH before it starts the next one - so a step
      # after this one holding secrets.DSL_BOT_TOKEN would run student code as the org
      # owner. The failure issue, the mail and the recovery close therefore live in
      # `autograde-report`, on a runner of their own. Held there by a renderer test.
      - name: Autograde every passed deadline
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          COURSE: ${{ github.repository_owner }}
          SEMESTER: ${{ matrix.semester }}
          PREVIEW: ${{ inputs.preview }}
          EVENT: ${{ github.event_name }}
        run: |
          gh auth setup-git
          args=(--course-org "$COURSE" --semester-org "$SEMESTER" --autograde-only)
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$PREVIEW" != "false" ]; then args+=(--preview); else args+=(--no-preview); fi
          python3 -m dsl_course.scheduler "${args[@]}"
  autograde-report:
    # What the grading job may not do for itself. One leg per semester, exactly like the
    # matrix it reports on, so each semester keeps its own failure issue and a green semester
    # never closes a red one's.
    needs: [release, autograde]
    if: "!cancelled() && needs.release.outputs.semesters != '' && needs.release.outputs.semesters != '[]'"
    strategy:
      fail-fast: false
      matrix:
        semester: ${{ fromJSON(needs.release.outputs.semesters) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: hertie-data-science-lab/dsl-teaching-toolkit
          ref: release
          # No credential left behind in $GITHUB_WORKSPACE/.git/config. Nothing here ever
          # pushes to the checkout - the central repo is public and read-only to these
          # jobs, and every write goes through `gh`/`gh auth setup-git` against ANOTHER
          # repo - so the persisted header buys nothing, and the grading jobs run the
          # student's own code with this directory on disk.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: How this semester's grading leg ended
        id: graded
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          SEMESTER: ${{ matrix.semester }}
          LEGS: ${{ needs.autograde.result }}
        run: |
          # The matrix's combined result is `success` only when every leg succeeded, and it
          # is settled the moment this job starts - unlike the jobs API below, which can
          # still read a just-finished leg's conclusion as null. So a green matrix never
          # asks it, and a lagging API cannot file a failure for a leg that passed.
          if [ "$LEGS" = "success" ]; then
            echo "graded leg concluded: success"
            echo "result=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The leg's `name:` is `autograde <semester>`, set explicitly on the job so this
          # lookup matches a string the workflow declares rather than one GitHub composes.
          # `|| true` and a `head`: under `bash -e` a transient search failure would
          # otherwise abort the job that exists to report, and a re-run reads its OWN
          # attempt. A null conclusion is the API lagging behind a leg `needs:` says has
          # finished, so it is asked again for about a minute before it is believed. A leg
          # cancelled with no steps never started - a later run's leg took its place in the
          # semester's queue - so it reads as skipped: nothing ran, nothing failed.
          for pause in 0 5 10 20 30; do
            sleep "$pause"
            row=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" --paginate \
              --jq ".jobs[] | select(.name == \"autograde $SEMESTER\") | \"\(if .conclusion == \"cancelled\" and ((.steps // []) | length) == 0 then \"skipped\" else .conclusion end) \(.id)\"" | head -n 1) || true
            if [ "${row%% *}" != "null" ]; then break; fi
          done
          if [ -z "$row" ]; then
            # No leg for this semester in this attempt - a semester registered between the two
            # jobs, or a matrix leg GitHub never started. Nothing happened, so nothing is
            # filed and nothing is closed.
            echo "no grading leg for this semester in this run - nothing to report"
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "graded leg concluded: ${row%% *}"
          echo "result=${row%% *}" >> "$GITHUB_OUTPUT"
          echo "job_id=${row##* }" >> "$GITHUB_OUTPUT"
      - name: Report an unattended failure as an issue
        id: notice
        if: steps.graded.outputs.result != 'success' && steps.graded.outputs.result != 'skipped' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SEMESTER: ${{ matrix.semester }}
        run: |
          title="$WORKFLOW (autograde $SEMESTER) is failing"
          note=$(printf 'The unattended run failed or was cancelled: %s\n\nNothing retries it before the next scheduled run. This issue closes itself once a run succeeds.\n' "$RUN_URL")
          # A filed issue emails only the repo's watchers, which in practice is nobody, so
          # the FIRST report mentions the org's admins; course-admin, not instructors,
          # because broken infrastructure is not the teaching staff's problem.
          # Teaching staff read these too (course-admin is mentioned below), and a
          # broken run is not theirs to fix - so the note says who is already on it.
          note=$(printf '%s\nThe toolkit maintainer has been emailed the log - nothing for the instructors to do.\n' "$note")
          body=$(printf '%s\ncc @%s/course-admin\n' "$note" "${REPO%%/*}")
          # The step runs under `bash -e`, so an unguarded capture would abort the step on a
          # transient search failure - before the `gh issue create` that is the whole point.
          # No dedupe hit just means we file a fresh issue.
          existing=$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number,title,updatedAt --jq "map(select(.title == \"$title\"))[0] | select(.) | \"\(.number) \(.updatedAt)\"") || true
          # `report` is what gates the mail step below, so the two channels fire
          # together: a maintainer who gets an email can always find the issue it came
          # from, and a thread that is being kept quiet does not mail either.
          if [ -z "$existing" ]; then
            # Two strikes: a first failure files and mails only if this job also failed
            # in the previous run, so a one-off GitHub blip reaches nobody. Any lookup
            # error reports. GITHUB_WORKFLOW_REF ends `<file>@<ref>`.
            wf=${GITHUB_WORKFLOW_REF%@*}
            prior=$(gh api "repos/$REPO/actions/workflows/${wf##*/}/runs?per_page=30" \
              --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .event != \"workflow_dispatch\") | .id" | head -n 10) || prior=""
            prev=""
            for id in $prior; do
              prev=$(gh api "repos/$REPO/actions/runs/$id/jobs" --paginate \
                --jq ".jobs[] | select(.name == \"autograde $SEMESTER\" and .conclusion != null and .conclusion != \"skipped\" and (.conclusion != \"cancelled\" or ((.steps // []) | length) > 0)) | .conclusion" | head -n 1) || prev=""
              [ -n "$prev" ] && break
            done
            if [ "$prev" = "success" ]; then
              echo "first failure since the last good run - no issue or mail yet; the next run reports if it fails too"
              echo "report=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh issue create --repo "$REPO" --title "$title" --body "$body"
            echo "report=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Already open. The scheduler fails on EVERY tick while a fault stands, and a
          # comment per run buried the thread and mentioned course-admin dozens of times a
          # day about one fault. So comment only once the thread has been quiet for six hours,
          # and without the cc - whoever it reached the first time is already subscribed.
          # An unparseable timestamp reads as epoch, i.e. "long overdue": the point of the
          # issue is that somebody hears about the failure.
          last=$(date -u -d "${existing#* }" +%s 2>/dev/null || echo 0)
          if [ $(( $(date -u +%s) - last )) -lt 21600 ]; then
            echo "already reported within the last 6h - see issue ${existing%% *}"
            echo "report=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh issue comment "${existing%% *}" --repo "$REPO" --body "$note"
          echo "report=true" >> "$GITHUB_OUTPUT"
      - name: Email the maintainer the failed step's log
        if: steps.graded.outputs.result != 'success' && steps.graded.outputs.result != 'skipped' && github.event_name != 'workflow_dispatch' && steps.notice.outputs.report == 'true'
        env:
          WORKFLOW: ${{ github.workflow }}
          COURSE: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          REPO: ${{ github.repository }}
          JOB_ID: ${{ steps.graded.outputs.job_id }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_CERT: ${{ secrets.GRAPH_CLIENT_CERT }}
          GRAPH_SENDER: ${{ secrets.GRAPH_SENDER }}
          DSL_MAINTAINER_EMAIL: ${{ secrets.DSL_MAINTAINER_EMAIL }}
        run: |
          gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" 2>/dev/null | tail -n 30 \
            | python3 -m dsl_course.notify run-failed --course-org "$COURSE" \
                --workflow "$WORKFLOW" --run-url "$RUN_URL" || true
      - name: Close the failure issue once a run succeeds
        if: steps.graded.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SEMESTER: ${{ matrix.semester }}
        run: |
          title="$WORKFLOW (autograde $SEMESTER) is failing"
          for n in $(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number"); do
            gh issue close "$n" --repo "$REPO" --comment "Recovered: $RUN_URL"
          done
