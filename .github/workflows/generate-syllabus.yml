# SYSTEM-OWNED - do not edit, edits here are overwritten. This workflow is
# re-rendered from the central DSL teaching toolkit by 'Refresh actions' (nightly).
name: Generate syllabus

# Writes the weekly plan of a syllabus - one block per session, with its title, its
# learning objectives and its reading list - from the semester's
# semester-config/schedule.yml and its readings entries.
#
# It goes into your syllabus file (SYLLABUS.md, or the one materials.yml declares),
# between <!-- dsl:weekly-plan --> and <!-- /dsl:weekly-plan -->; without those lines it
# adds them under "## Weekly plan" at the end. Move the marked block anywhere in the file
# and a re-run updates it there; nothing else in the file changes.
# Dropdowns are refreshed by the 'Refresh actions' workflow.

on:
  workflow_dispatch:
    inputs:
      course_source_repo:
        description: "Repo holding your syllabus and readings"
        required: true
        type: choice
        default: "course-materials-f2026"
        options:
          - course-materials-f2026
      semester_org:
        description: "Semester whose schedule.yml supplies the sessions"
        required: true
        type: choice
        default: "hertie-nlp-f2026"
        options:
          - hertie-nlp-f2026
      preview:
        description: "Preview - print the block, write nothing to your syllabus"
        type: boolean
        default: true

permissions: {}

jobs:
  check-team:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the user may run actions for THIS repo
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          # Faculty & instructors have write+ on the course repos; students never do (and triggering a
          # workflow_dispatch already requires write), so repo permission is the gate.
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/tmp/gherr || true)
          case "$perm" in admin|write|maintain) exit 0 ;; esac
          echo "::error::@$ACTOR lacks write on $REPO (permission='$perm'). gh api said:"
          cat /tmp/gherr || true
          exit 1

  syllabus:
    needs: check-team
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: hertie-data-science-lab/dsl-teaching-toolkit
          ref: 78da401eed3ddd2b42d571cebb6070305e6d384f
          # No credential left behind in $GITHUB_WORKSPACE/.git/config. Nothing here ever
          # pushes to the checkout - the central repo is public and read-only to these
          # jobs, and every write goes through `gh`/`gh auth setup-git` against ANOTHER
          # repo - so the persisted header buys nothing, and the grading jobs run the
          # student's own code with this directory on disk.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Generate
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          COURSE: ${{ github.repository_owner }}
          SEMESTER_ORG: ${{ inputs.semester_org }}
          SOURCE_REPO: ${{ inputs.course_source_repo }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          args=(--course-org "$COURSE" --semester-org "$SEMESTER_ORG" --course-source-repo "$SOURCE_REPO")
          if [ "$PREVIEW" = "false" ]; then args+=(--no-preview); else args+=(--preview); fi
          python3 -m dsl_course.syllabus "${args[@]}"
