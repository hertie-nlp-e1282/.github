# SYSTEM-OWNED - do not edit, edits here are overwritten. This workflow is
# re-rendered from the central DSL teaching toolkit by 'Refresh actions' (nightly).
name: Distribute grades

# Reads the grading sheets in semester-config and sends what they hold: each student's
# private grades-<handle> repo, the registrar export, and (unless silenced) an email saying
# there is something new to read. Nothing is posted into a submission repo, and nothing is
# said twice - a re-run after one correction reaches one student.
# `assignment` empty returns every sheet; named, it returns that assignment's marks only,
# and each gradebook still shows every assignment already returned.
# Preview first; it writes no grades, sends no mail, and posts who gets what as a
# "Distribute grades preview" issue in semester-config. Needs the GRAPH_* secrets to mail.
# The scheduler's automatic return (an assignment's `marks_return_datetime`) arrives here
# as a `return-marks` dispatch, and the Console's Return marks starts this workflow too, so
# every real return of a semester shares one queue. A preview queues behind nothing.

on:
  repository_dispatch:
    types: [return-marks]
  workflow_dispatch:
    inputs:
      semester_org:
        description: "Semester org"
        required: true
        type: choice
        default: "hertie-nlp-f2026"
        options:
          - hertie-nlp-f2026
      assignment:
        description: "Only this assignment (its repo name, e.g. assignment-2); empty = every one"
        required: false
        default: ""
      preview:
        description: "Preview who gets what, as an issue in semester-config - push no grades, send nothing"
        type: boolean
        default: true
      notify:
        description: "Email each student that their marks are in (off = just push the grades)"
        type: boolean
        default: true
      receipt_note:
        description: "Also post 'Marks returned: see your marks repo.' once on each student's Submission receipts issue"
        type: boolean
        default: false
      include_feedback:
        description: "Put the markers' feedback text into each student's email"
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.preview != false && github.run_id || format('{0}-distribute-grades-{1}', github.repository, github.event_name == 'repository_dispatch' && github.event.client_payload.semester_org || inputs.semester_org) }}
  cancel-in-progress: false

permissions: {}

jobs:
  check-team:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the user may run actions for THIS repo
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          # Faculty & instructors have write+ on the course repos; students never do (and triggering a
          # workflow_dispatch already requires write), so repo permission is the gate.
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/tmp/gherr || true)
          case "$perm" in admin|write|maintain) exit 0 ;; esac
          echo "::error::@$ACTOR lacks write on $REPO (permission='$perm'). gh api said:"
          cat /tmp/gherr || true
          exit 1

  distribute-grades:
    # A button press waits for its check-team gate; the scheduler's dispatch has none
    # (no actor), and `--dispatched-by` checks what it names instead.
    if: "!cancelled() && (github.event_name == 'repository_dispatch' || needs.check-team.result == 'success')"
    needs: check-team
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: hertie-data-science-lab/dsl-teaching-toolkit
          ref: 78da401eed3ddd2b42d571cebb6070305e6d384f
          # No credential left behind in $GITHUB_WORKSPACE/.git/config. Nothing here ever
          # pushes to the checkout - the central repo is public and read-only to these
          # jobs, and every write goes through `gh`/`gh auth setup-git` against ANOTHER
          # repo - so the persisted header buys nothing, and the grading jobs run the
          # student's own code with this directory on disk.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Distribute grades
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          SEMESTER_ORG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.semester_org || inputs.semester_org }}
          PREVIEW: ${{ github.event_name == 'repository_dispatch' && 'false' || inputs.preview }}
          NOTIFY: ${{ inputs.notify }}
          RECEIPT_NOTE: ${{ inputs.receipt_note }}
          INCLUDE_FEEDBACK: ${{ inputs.include_feedback }}
          ASSIGNMENT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.assignment || inputs.assignment }}
          DISPATCHED_BY: ${{ github.event_name == 'repository_dispatch' && github.repository_owner || '' }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_CERT: ${{ secrets.GRAPH_CLIENT_CERT }}
          GRAPH_SENDER: ${{ secrets.GRAPH_SENDER }}
          DSL_MAINTAINER_EMAIL: ${{ secrets.DSL_MAINTAINER_EMAIL }}
        run: |
          args=(--semester-org "$SEMESTER_ORG")
          if [ "$PREVIEW" = "false" ]; then args+=(--no-preview); else args+=(--preview); fi
          [ "$NOTIFY" = "false" ] && args+=(--no-notify)
          [ "$RECEIPT_NOTE" = "true" ] && args+=(--receipt-note)
          [ "$INCLUDE_FEEDBACK" = "true" ] && args+=(--include-feedback)
          [ -n "$ASSIGNMENT" ] && args+=(--assignment "$ASSIGNMENT")
          [ -n "$DISPATCHED_BY" ] && args+=(--dispatched-by "$DISPATCHED_BY")
          python3 -m dsl_course.grades distribute "${args[@]}"
